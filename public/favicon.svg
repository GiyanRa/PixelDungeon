<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Background -->
  <rect width="16" height="16" fill="#0e0e18"/>
  <!-- Body -->
  <rect x="3" y="3" width="8" height="8" fill="#3ddc84"/>
  <!-- Legs -->
  <rect x="4" y="10" width="2" height="2" fill="#28a060"/>
  <rect x="7" y="10" width="2" height="2" fill="#28a060"/>
  <!-- Eyes -->
  <rect x="4" y="5" width="2" height="2" fill="#ffffff"/>
  <rect x="7" y="5" width="2" height="2" fill="#ffffff"/>
  <!-- Pupils -->
  <rect x="5" y="6" width="1" height="1" fill="#222233"/>
  <rect x="8" y="6" width="1" height="1" fill="#222233"/>
  <!-- Sword blade -->
  <rect x="11" y="2" width="1" height="6" fill="#a0a0b0"/>
  <!-- Crossguard -->
  <rect x="10" y="5" width="3" height="1" fill="#d4a42a"/>
</svg>